# CERATA: copy to .github/workflows/cerata.yml in your repo.
# Then comment on any issue:   /cerata hunt owner/repo   ·   /cerata consume owner/repo
name: CERATA

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      command:
        description: 'e.g. "hunt psf/requests" or "consume psf/requests src/requests/adapters.py"'
        required: true

permissions:
  contents: write        # push the consume branch
  pull-requests: write   # open the PR
  issues: write          # reply with hunt reports

concurrency:
  group: cerata-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  cerata:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.comment.body, '/cerata')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # model-written tests must never see a token
      - uses: GreatPyreneseDad/CERATA-Project@v1
        with:
          command: ${{ github.event.inputs.command }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # model: claude-sonnet-4-5
          # github-token: ${{ secrets.CERATA_PAT }}   # use a PAT/App token if CI should run on CERATA PRs
